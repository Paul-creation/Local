name: 하이라이트 영상 (YouTube 한도 초기화 직후)

on:

  workflow_dispatch:        # Actions 탭에서 직접 실행 가능

concurrency:
  group: data-jobs          # 매일·매주 작업이 겹치지 않게 순서대로
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 환경변수 파일 만들기
        run: printf '%s\n' "$ENV_FILE" > .env.local
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      - run: node scripts/run-steps.mjs highlight
