name: 매주 갱신 (새 게임·정보 보강)

on:
  schedule:
    - cron: '0 17 * * 4'    # 매주 금요일 한국 시간 새벽 2시 (에픽 무료 게임 바뀐 직후)
  workflow_dispatch:        # Actions 탭에서 직접 실행 가능

concurrency:
  group: data-jobs
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24 # parse-specs가 app/lib/*.ts를 바로 읽음 — .ts 직접 실행은 Node 22.18 이상·24부터 기본 지원(22.x 중 낮은 버전은 실패)
          cache: npm
      - run: npm ci
      - name: 환경변수 파일 만들기
        run: printf '%s\n' "$ENV_FILE" > .env.local
        env:
          ENV_FILE: ${{ secrets.ENV_FILE }}
      - run: node scripts/run-steps.mjs weekly
      # 인원 검증 대기 목록(scripts/.cache/pending-players.json)을 내려받을 수 있게 올림 (숨김 폴더라 include-hidden-files)
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pending-players-${{ github.run_number }}
          path: |
            scripts/.cache/pending-players.json
            scripts/.cache/players-store-pending.json
          include-hidden-files: true
          retention-days: 30
          if-no-files-found: ignore
