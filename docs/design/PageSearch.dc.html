      </a>
      <nav aria-label="주요 메뉴" style="display: flex; align-items: center; gap: 26px; flex-wrap: wrap"><a href="#top" style="color: #F4F1EA; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0; border-bottom: 2px solid #3D7BFF">홈</a><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">비교</a><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">내 PC</a><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">찜목록</a><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">커뮤니티</a><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">의견 보내기</a><a href="#top" style="display: inline-flex; align-items: center; gap: 8px; background: #3D7BFF; color: #141311; text-decoration: none; font-weight: 700; font-size: 14px; padding: 9px 16px 9px 10px; border-radius: 6px"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #141311; opacity: 0.35"></span>PPPAUL</a></nav>
    </div>
  </header>
  <main style="flex-grow: 1">
    <section aria-label="검색 조건" style="max-width: 1200px; margin: 0 auto; padding: 32px 32px 0">
      <div style="background: #1E1D1A; border: 1px solid #3A3833; border-radius: 14px; padding: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch">
        <div style="position: relative; flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; padding: 12px 20px; border-right: 1px solid #3A3833;"><span style="font-size: 13px; font-weight: 700; color: #F4F1EA">누구랑</span><span style="font-size: 15px; color: #F4F1EA">2명</span></div><div style="position: relative; flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; padding: 12px 20px; border-right: 1px solid #3A3833;"><span style="font-size: 13px; font-weight: 700; color: #F4F1EA">어떻게</span><span style="font-size: 15px; color: #F4F1EA">온라인 협동</span></div><div style="position: relative; flex: 1 1 180px; display: flex; flex-direction: column; gap: 4px; padding: 12px 20px; background: #2A2925; border-radius: 10px; box-shadow: inset 0 0 0 1px #4A4741"><span style="font-size: 13px; font-weight: 700; color: #F4F1EA">뭐 할까</span><span style="font-size: 15px; color: #F4F1EA; white-space: nowrap">공포 외 1개</span><div role="dialog" aria-label="뭐 할까 선택" style="position: absolute; top: calc(100% + 12px); left: 0; z-index: 40; width: 440px; background: #1E1D1A; border: 1px solid #3A3833; border-radius: 14px; box-shadow: 0 24px 60px rgba(0, 0, 0, 0.6); padding: 18px; display: flex; flex-direction: column; gap: 14px; text-align: left"><input type="text" placeholder="게임 이름이나 키워드 (예: 좀비, 리썰컴퍼니)" style="background: #141311; border: 1px solid #3A3833; border-radius: 8px; color: #F4F1EA; font: inherit; font-size: 15px; padding: 12px 14px; outline: none"><div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px"><button type="button" aria-pressed="true" style="background: #F4F1EA; color: #141311; border: 1px solid #F4F1EA; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">공포</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">생존·크래프팅</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">운전·여행</button><button type="button" aria-pressed="true" style="background: #F4F1EA; color: #141311; border: 1px solid #F4F1EA; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">요리</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">퍼즐</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">우주·SF</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">판타지</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">레이싱</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">스포츠</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 12px 10px; cursor: pointer">리듬</button></div><div style="display: flex; gap: 6px; align-items: center; font-size: 13px; color: #A9A498"><span>여러 개 고르면</span><button type="button" aria-pressed="true" style="background: #F4F1EA; color: #141311; border: 1px solid #F4F1EA; border-radius: 6px; font: inherit; font-weight: 700; font-size: 13px; padding: 5px 10px">하나라도</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 13px; padding: 5px 10px">모두</button></div><div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #2E2C28; padding-top: 14px"><button type="button" style="background: transparent; border: none; color: #A9A498; font: inherit; font-weight: 700; font-size: 14px; text-decoration: underline; cursor: pointer; padding: 0">지우기</button><button type="button" style="background: #3D7BFF; color: #141311; border: none; border-radius: 8px; font: inherit; font-weight: 700; font-size: 14px; padding: 10px 18px; cursor: pointer">435개 보기</button></div></div></div>
        <button type="button" style="background: #3D7BFF; color: #141311; border: none; border-radius: 10px; font: inherit; font-weight: 700; font-size: 16px; padding: 0 28px; min-height: 56px; cursor: pointer">다시 찾기</button>
      </div>
    </section>
    <section aria-label="검색 결과" style="max-width: 1200px; margin: 0 auto; padding: 40px 32px 72px; display: flex; gap: 32px; flex-wrap: wrap; align-items: flex-start">
      <aside aria-label="필터" style="flex: 1 1 220px; max-width: 260px; display: flex; flex-direction: column; gap: 22px">
        <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 900; letter-spacing: 0.14em; color: #A9A498">정렬</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" aria-pressed="true" style="position: relative; background: #F4F1EA; color: #141311; border: 1px solid #F4F1EA; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">추천순</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">가격 낮은 순</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">할인율</button></div></div>
        <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 900; letter-spacing: 0.14em; color: #A9A498">더 좁히기</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">내 PC로 돌아가는 게임</button><button type="button" aria-pressed="true" style="position: relative; background: #F4F1EA; color: #141311; border: 1px solid #F4F1EA; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">지금 할인 중</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">무료</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">한국어 지원</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">출시 전 데모</button></div></div>
        <div style="display: flex; flex-direction: column; gap: 10px"><span style="font-size: 13px; font-weight: 900; letter-spacing: 0.14em; color: #A9A498">한 판 시간</span>
          <div style="display: flex; flex-wrap: wrap; gap: 8px"><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">30분 이하</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">1시간 안팎</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">몇 시간씩</button></div></div>
      </aside>
      <div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column">
        <div style="display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; border-bottom: 1px solid #2E2C28; padding-bottom: 12px; margin-bottom: 18px"><div style="display: flex; flex-direction: column; gap: 6px"><span style="font-size: 13px; font-weight: 900; letter-spacing: 0.14em; color: #A9A498">2명 · 온라인 협동 · 공포 외 1개 · 할인 중</span><h2 style="margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.03em; color: #F4F1EA">조건에 맞는 게임 [N]개</h2></div></div>
        <div style="display: flex; flex-direction: column; gap: 14px">
          <sc-for list="{{results}}" as="g" hint-placeholder-count="5">
            <a href="#top" style="position: relative; display: flex; gap: 20px; background: #1E1D1A; border: 1px solid #2E2C28; border-radius: 8px; padding: 14px; text-decoration: none">
              <span style="position: relative; display: block; width: 96px; flex: 0 0 auto; aspect-ratio: 2 / 3; border-radius: 4px; background: {{g.bg}}; box-shadow: inset 0 0 0 1px rgba(244, 241, 234, 0.1)"><span style="position: absolute; left: 10px; bottom: 10px; color: rgba(244, 241, 234, 0.55); font-size: 12px; font-weight: 700">[포스터]</span></span>
              <sc-if value="{{g.first}}" hint-placeholder-val="{{false}}"><span aria-hidden="true" style="position: absolute; top: -7px; left: -7px; width: 16px; height: 16px; border-top: 3px solid #3D7BFF; border-left: 3px solid #3D7BFF"></span><span aria-hidden="true" style="position: absolute; top: -7px; right: -7px; width: 16px; height: 16px; border-top: 3px solid #3D7BFF; border-right: 3px solid #3D7BFF"></span><span aria-hidden="true" style="position: absolute; bottom: -7px; left: -7px; width: 16px; height: 16px; border-bottom: 3px solid #3D7BFF; border-left: 3px solid #3D7BFF"></span><span aria-hidden="true" style="position: absolute; bottom: -7px; right: -7px; width: 16px; height: 16px; border-bottom: 3px solid #3D7BFF; border-right: 3px solid #3D7BFF"></span></sc-if>
              <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 10px; padding-top: 4px">
                <sc-if value="{{g.first}}" hint-placeholder-val="{{false}}"><span style="font-size: 13px; font-weight: 900; letter-spacing: 0.08em; color: #7AA6FF">가장 잘 맞아요</span></sc-if>

                <span style="font-size: 14px; color: #A9A498">{{g.info}}</span>
                <span style="display: flex; gap: 8px; flex-wrap: wrap">
                  <sc-for list="{{g.why}}" as="w" hint-placeholder-count="3"><span style="background: rgba(61, 123, 255, 0.14); color: #7AA6FF; border-radius: 4px; font-size: 13px; font-weight: 700; padding: 5px 10px">{{w}}</span></sc-for>
                </span>
              </span>
              <span style="flex: 0 0 auto; display: flex; flex-direction: column; align-items: flex-end; justify-content: center; gap: 4px; padding-right: 8px; text-align: right">
                <span style="font-size: 13px; color: #A9A498">Steam 가격</span>
                <span style="font-family: Inter, sans-serif; font-weight: 900; font-size: 24px; letter-spacing: -0.03em; color: #F4F1EA">₩[가격]</span>
              </span>
            </a>
          </sc-for>
        </div>
      </div>
    </section>
  </main>
  <footer style="border-top: 1px solid #2E2C28; background: #0B0A09">
    <div style="max-width: 1200px; margin: 0 auto; padding: 28px 32px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 14px; color: #A9A498">
      <span style="font-family: Inter, sans-serif; font-weight: 900; letter-spacing: -0.05em; color: #F4F1EA; font-size: 18px">select screen</span>
      <span>© 2026 The Circles</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1500}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {};
  }

  renderVals() {
    const hues = ["#3B2F2A", "#24303B", "#2F3A2A", "#3A2433", "#2C2C3E", "#3D3426", "#1F3534", "#352A3F", "#2E2A26", "#26323F"];
    return {
      results: [
        { name: 'It Takes Two', info: '2인 전용 협동 · 액션 어드벤처', why: ['2명 딱 맞음', '친구 패스: 한 명만 사도 됨', '지금 할인 중'] },
        { name: 'Split Fiction', info: '2인 전용 협동 · 어드벤처', why: ['2명 딱 맞음', '친구 패스', '한국어 지원'] },
        { name: 'Portal 2', info: '2인 협동 퍼즐', why: ['2명 딱 맞음', '지금 할인 중', '사양 낮음'] },
        { name: 'Unravel Two', info: '2인 협동 퍼즐 플랫포머', why: ['2명 딱 맞음', '지금 할인 중'] },
        { name: 'Overcooked! 2', info: '최대 4인 · 파티 협동', why: ['2명부터 가능', '한 판 짧음', '지금 할인 중'] }
      ].map((g, i) => ({ name: g.name, info: g.info, why: g.why, bg: hues[(i * 3 + 1) % hues.length], first: i === 0 }))
    };
  }
}
</script>
