<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Select Screen 의견 보내기</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;900&amp;family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0B0A09}
a{color:#7AA6FF}a:hover{color:#A9C5FF}
</style>
</helmet>
<div id="top" style="min-height: 1100px; background: linear-gradient(180deg, #141311 0%, #121110 45%, #0B0A09 100%); color: #F4F1EA; font-family: Inter, 'Noto Sans KR', system-ui, sans-serif; display: flex; flex-direction: column">
  <header style="background: #141311; border-bottom: 1px solid #2E2C28">
    <div style="max-width: 1200px; margin: 0 auto; padding: 0 32px; height: 76px; display: flex; align-items: center; justify-content: space-between; gap: 24px; flex-wrap: wrap">
      <a href="#top" aria-label="Select Screen 홈" style="display: inline-flex; align-items: center; gap: 12px; text-decoration: none">
        <span style="position: relative; display: inline-flex; padding: 6px 9px"><span aria-hidden="true" style="position: absolute; top: 0; left: 0; width: 8px; height: 8px; border-top: 2px solid #3D7BFF; border-left: 2px solid #3D7BFF"></span><span aria-hidden="true" style="position: absolute; top: 0; right: 0; width: 8px; height: 8px; border-top: 2px solid #3D7BFF; border-right: 2px solid #3D7BFF"></span><span aria-hidden="true" style="position: absolute; bottom: 0; left: 0; width: 8px; height: 8px; border-bottom: 2px solid #3D7BFF; border-left: 2px solid #3D7BFF"></span><span aria-hidden="true" style="position: absolute; bottom: 0; right: 0; width: 8px; height: 8px; border-bottom: 2px solid #3D7BFF; border-right: 2px solid #3D7BFF"></span><span style="font-family: Inter, sans-serif; font-weight: 900; font-size: 24px; letter-spacing: -0.05em; color: #F4F1EA; line-height: 1">select</span></span>
        <span style="font-family: Inter, sans-serif; font-weight: 900; font-size: 24px; letter-spacing: -0.05em; color: #F4F1EA; line-height: 1">screen</span>
      </a>
      <nav aria-label="주요 메뉴" style="display: flex; align-items: center; gap: 26px; flex-wrap: wrap"><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">홈</a><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">비교</a><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">내 PC</a><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">찜목록</a><a href="#top" style="color: #C9C4B8; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0">커뮤니티</a><a href="#top" style="color: #F4F1EA; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.04em; padding: 8px 0; border-bottom: 2px solid #3D7BFF">의견 보내기</a><a href="#top" style="display: inline-flex; align-items: center; gap: 8px; background: #3D7BFF; color: #141311; text-decoration: none; font-weight: 700; font-size: 14px; padding: 9px 16px 9px 10px; border-radius: 6px"><span aria-hidden="true" style="width: 22px; height: 22px; border-radius: 50%; background: #141311; opacity: 0.35"></span>PPPAUL</a></nav>
    </div>
  </header>
  <main style="flex-grow: 1">
    <section style="max-width: 760px; margin: 0 auto; padding: 56px 32px 96px">
      <span style="font-size: 13px; font-weight: 900; letter-spacing: 0.14em; color: #A9A498">의견 보내기</span>
      <h1 style="margin: 10px 0 12px; font-size: 40px; font-weight: 900; letter-spacing: -0.03em; line-height: 1.2">친구랑 할 게임 찾다가<br>불편했던 거 알려주세요</h1>
      <p style="margin: 0 0 32px; font-size: 16px; line-height: 1.7; color: #C9C4B8">세 명이서 직접 읽고 고쳐요. 로그인 없이 보내도 돼요.</p>
      <form style="background: #1E1D1A; border: 1px solid #3A3833; border-radius: 12px; padding: 24px; display: flex; flex-direction: column; gap: 22px">
        <fieldset style="border: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px"><legend style="font-size: 14px; font-weight: 700; color: #F4F1EA; padding: 0; margin-bottom: 10px">어떤 의견인가요?</legend><div style="display: flex; gap: 10px; flex-wrap: wrap"><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">버그 신고</button><button type="button" aria-pressed="true" style="position: relative; background: #F4F1EA; color: #141311; border: 1px solid #F4F1EA; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">기능 제안</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">게임 추가 요청</button><button type="button" aria-pressed="false" style="background: transparent; color: #C9C4B8; border: 1px solid #3A3833; border-radius: 6px; font: inherit; font-weight: 700; font-size: 14px; padding: 9px 16px; cursor: pointer">기타</button></div></fieldset>
        <label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700">내용</span><textarea rows="6" placeholder="예: 3명이서 할 공포 게임을 찾는데 결과가 너무 적어요" style="background: #141311; border: 1px solid #3A3833; border-radius: 8px; color: #F4F1EA; font: inherit; font-size: 15px; padding: 14px; resize: vertical"></textarea></label>
        <label style="display: flex; flex-direction: column; gap: 8px"><span style="font-size: 14px; font-weight: 700">답장 받을 이메일 <span style="font-weight: 400; color: #A9A498">(선택)</span></span><input type="email" placeholder="you@example.com" style="background: #141311; border: 1px solid #3A3833; border-radius: 8px; color: #F4F1EA; font: inherit; font-size: 15px; padding: 12px 14px"></label>
        <button type="button" style="align-self: flex-start; background: #3D7BFF; color: #141311; border: none; border-radius: 8px; font: inherit; font-weight: 700; font-size: 15px; height: 48px; padding: 0 28px; cursor: pointer">보내기</button>
      </form>
    </section>
  </main>
  <footer style="border-top: 1px solid #2E2C28; background: #0B0A09">
    <div style="max-width: 1200px; margin: 0 auto; padding: 28px 32px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; font-size: 14px; color: #A9A498">
      <span style="font-family: Inter, sans-serif; font-weight: 900; letter-spacing: -0.05em; color: #F4F1EA; font-size: 18px">select screen</span>
      <span>© 2026 The Circles</span>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":1100}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {};
  }

  renderVals() {
    const hues = ["#3B2F2A", "#24303B", "#2F3A2A", "#3A2433", "#2C2C3E", "#3D3426", "#1F3534", "#352A3F", "#2E2A26", "#26323F"];
    return {};
  }
}
</script>
</body>
</html>
